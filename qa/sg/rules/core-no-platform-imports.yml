id: core-no-platform-imports
language: go
severity: error
message: The core must not import platform or filesystem packages. Keep them in an adapter.
files:
  - internal/core/**/*.go
ignores:
  - "**/*_test.go"
metadata:
  adr: adr/technical/2026-10-25-framework-failures-stop-at-the-adapter.md
rule:
  kind: import_spec
  has:
    field: path
    regex: '"(os|io/fs|path/filepath|os/exec)"'

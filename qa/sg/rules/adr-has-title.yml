id: adr-has-title
language: markdown
severity: error
message: Every ADR must start with a single H1 title.
files:
  - adr/**/*.md
metadata:
  adr: adr/process/2026-10-01-document-decisions-as-adrs.md
rule:
  kind: document
  not:
    has:
      stopBy: end
      kind: atx_heading
      regex: '^# '

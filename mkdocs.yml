site_name: sombra-cli
site_url: https://yunier-rojas.github.io/sombra-cli/
site_description: Sombra CLI generates projects from reusable Git templates.
site_author: Yunier Rojas García

repo_url: https://github.com/yunier-rojas/sombra-cli
repo_name: yunier-rojas/sombra-cli
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - search.share
    - navigation.footer
    - content.action.edit

plugins:
  - search
  - social
  - offline

nav:
  - Home: index.md
  # sombra:skip
  - User Guide:
      - User Guide: user-guide/index.md
      - Installation: user-guide/installation.md
      - Commands: user-guide/commands.md
      - Sombra File: user-guide/sombra-file.md
  - Templates:
      - Start: sombra-templates/index.md
      - Concepts: sombra-templates/concepts.md
      - Start a Template: sombra-templates/start-a-template.md
      - Best Practices: sombra-templates/best-practices.md
  # sombra:end
  - More:
      - About: about.md
      - Contact: contact.md

copyright: Copyright &copy; 2025 Yunier Rojas García.


name: sombra-cli CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  HUGO_VERSION: '0.154.3'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: Check import rules
        run: make imports

      - name: Check ast-grep rules
        run: make lint-sg

      - name: Check use case contracts
        run: make lint-usecases

      - name: Check third-party ownership
        run: make lint-third-party

      - name: Check ADR rules
        run: make lint-adr

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod tidy

      - name: Run Go tests
        run: make test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: docs/go.sum

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Validate docs
        run: make build-docs
